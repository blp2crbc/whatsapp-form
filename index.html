<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Message Formatter</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f4f4f9; }
    .container { max-width: 450px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
    h2 { text-align: center; color: #075e54; margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; display: block; margin-top: 10px; }
    input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; background-color: #25D366; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }
    button:active { background-color: #1ebc57; }
  </style>
</head>
<body>

<div class="container">
  <h2>WhatsApp Form</h2>
  
  <label for="reporter">Submitted By:</label>
  <input type="text" id="reporter" placeholder="Enter name...">

  <label for="location">Location / Zone:</label>
  <input type="text" id="location" placeholder="Enter location...">

  <label for="details">Details / Remarks:</label>
  <textarea id="details" rows="4" placeholder="Type report details here..."></textarea>

  <button onclick="copyToClipboard()">📋 Copy Text for WhatsApp</button>
</div>

<script>
function copyToClipboard() {
  const reporter = document.getElementById('reporter').value;
  const location = document.getElementById('location').value;
  const details = document.getElementById('details').value;

  if(!reporter && !location && !details) {
    alert("Please fill in at least one field!");
    return;
  }

  const formattedText = `*DAILY REPORT*\n\n` +
                        `*Submitted By:* ${reporter}\n` +
                        `*Location:* ${location}\n` +
                        `*Details:* ${details}\n\n` +
                        `_Sent via WhatsApp Form_`;

  navigator.clipboard.writeText(formattedText).then(() => {
    alert("Text copied to clipboard! Open WhatsApp and paste into your group.");
  }).catch(err => {
    alert("Copying failed. Please copy manually.");
  });
}
</script>

</body>
</html>
