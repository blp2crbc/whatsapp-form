<!DOCTYPE html>
<html lang="en">
<head>

  <title>OSH Observation Reporter</title>
  <style>
    body {

      padding: 15px; 
      background-color: #f4f4f9; 
    }
    .container { 
      max-width: 500px; 
      background: white; 
      padding: 20px; 
      border-radius: 10px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      margin: auto; 
    }
    h2 {

      color: #075e54; 
      font-size: 18px;
      margin-bottom: 20px;

    }
    label { 
      font-weight: bold; 
      font-size: 13px; 
      display: block; 
      margin-top: 12px; 
      color: #333;
    }
    input, textarea, select { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
      box-sizing: border-box; 
      font-size: 14px; 
    }
    button { 
      width: 100%; 
      background-color: #25D366; 
      color: white; 
      padding: 14px; 
      border: none; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 16px; 
      margin-top: 20px; 
      cursor: pointer; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    button:active { 
      background-color: #1ebc57; 
    }
  </style>
</head>
