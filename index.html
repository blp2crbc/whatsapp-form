<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLP2 – UAUC & GP REPORT</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 15px; 
      background-color: #f4f4f9; 
    }
    .container { 
      max-width: 500px; 
      background: white; 
      padding: 20px; 
      border-radius: 10px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      margin: auto; 
    }
    h2 { 
      text-align: center; 
      color: #075e54; 
      font-size: 18px;
      margin-bottom: 20px; 
      line-height: 1.3;
    }
    label { 
      font-weight: bold; 
      font-size: 13px; 
      display: block; 
      margin-top: 12px; 
      color: #333;
    }
    input, textarea, select { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
      box-sizing: border-box; 
      font-size: 14px; 
    }
    button { 
      width: 100%; 
      background-color: #25D366; 
      color: white; 
      padding: 14px; 
      border: none; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 16px; 
      margin-top: 20px; 
      cursor: pointer; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    button:active { 
      background-color: #1ebc57; 
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🦺 UNSAFE ACT UNSAFE CONDITION / GOOD PRACTICE FORM</h2>
  
  <label for="section">Section:</label>
  <input type="text" id="section" value="BLP2">

  <label for="location">Location:</label>
  <select id="location">
    <option value="Project Site Office">Project Site Office</option>
    <option value="SM08 TT3">SM08 TT3</option>
    <option value="SM08 Stutong Indah">SM08 Stutong Indah</option>
    <option value="SM08 Wan Alwi">SM08 Wan Alwi</option>
    <option value="SM08 Jln Setia Raja Island">SM08 Jln Setia Raja Island</option>
    <option value="SM08 Eversie">SM08 Eversie</option>
    <option value="SM09 80m Long Span">SM09 80m Long Span</option>
    <option value="SM09 100m Long Span">SM09 100m Long Span</option>
    <option value="SM09 Viva City Mall">SM09 Viva City Mall</option>
    <option value="SM09 Arena Sukan (Median)">SM09 Arena Sukan (Median)</option>
    <option value="SM09 Aion - Awi Builder">SM09 Aion - Awi Builder</option>
    <option value="SM10/SR10 Simpang Tiga (Interchange)">SM10/SR10 Simpang Tiga (Interchange)</option>
    <option value="SM11 The Spring P1">SM11 The Spring P1</option>
    <option value="SM11 The Spring P2">SM11 The Spring P2</option>
    <option value="SM11 The Spring P3">SM11 The Spring P3</option>
    <option value="SM11 The Spring P4">SM11 The Spring P4</option>
    <option value="SM12 JKR">SM12 JKR</option>
    <option value="SM12 Batu Lintang">SM12 Batu Lintang</option>
    <option value="SM12 Bukit Hantu">SM12 Bukit Hantu</option>
    <option value="SM13 Sarawak General Hospital">SM13 Sarawak General Hospital</option>
    <option value="SM14 Hikmah Exchange">SM14 Hikmah Exchange</option>
    <option value="Casting Yard">Casting Yard</option>
  </select>

  <label for="type">Type:</label>
  <select id="type">
    <option value="UA (Unsafe Act)">UA (Unsafe Act)</option>
    <option value="UC (Unsafe Condition)">UC (Unsafe Condition)</option>
    <option value="GP (Good Practice)">GP (Good Practice)</option>
  </select>

  <label for="subhazard">Sub-Hazard:</label>
  <select id="subhazard">
    <optgroup label="--- Unsafe Acts (UA) ---">
      <option value="UA1 Failure to Follow Procedure">UA1 Failure to Follow Procedure</option>
      <option value="UA2 Failure to Make Secure">UA2 Failure to Make Secure</option>
      <option value="UA3 Failure to Warn or Signal">UA3 Failure to Warn or Signal</option>
      <option value="UA4 Horseplay">UA4 Horseplay</option>
      <option value="UA5 Littering">UA5 Littering</option>
      <option value="UA6 No/Inadequate Supervision">UA6 No/Inadequate Supervision</option>
      <option value="UA7 Open Burning">UA7 Open Burning</option>
      <option value="UA8 Operating at Unsafe Speed">UA8 Operating at Unsafe Speed</option>
      <option value="UA9 Operating Without Authority">UA9 Operating Without Authority</option>
      <option value="UA10 Override/Bypass Safety Devices">UA10 Override/Bypass Safety Devices</option>
      <option value="UA11 PPE Non Compliance">UA11 PPE Non Compliance</option>
      <option value="UA12 Quarrel/Fighting">UA12 Quarrel/Fighting</option>
      <option value="UA13 Scheduled Waste Dumping">UA13 Scheduled Waste Dumping</option>
      <option value="UA14 Servicing Equipment in Operation">UA14 Servicing Equipment in Operation</option>
      <option value="UA15 Short Cut">UA15 Short Cut</option>
      <option value="UA16 Smoking Outside of Smoking Zone">UA16 Smoking Outside of Smoking Zone</option>
      <option value="UA17 Taking Unsafe Position">UA17 Taking Unsafe Position</option>
      <option value="UA18 Unauthorized Riding of Equipment">UA18 Unauthorized Riding of Equipment</option>
      <option value="UA19 Unsafe Use of Equipment/Tools">UA19 Unsafe Use of Equipment/Tools</option>
      <option value="UA20 Using Defective Equipment">UA20 Using Defective Equipment</option>
      <option value="UA21 Using Improper Equipment/Tools">UA21 Using Improper Equipment/Tools</option>
      <option value="UA22 Wrong Instruction">UA22 Wrong Instruction</option>
      <option value="UA23 Others">UA23 Others</option>
    </optgroup>
    <optgroup label="--- Unsafe Conditions (UC) ---">
      <option value="UC1 Adverse Environmental Condition">UC1 Adverse Environmental Condition</option>
      <option value="UC2 Congestion/Obstruction">UC2 Congestion/Obstruction</option>
      <option value="UC3 Defective Equipment/Tools">UC3 Defective Equipment/Tools</option>
      <option value="UC4 Excessive Noise">UC4 Excessive Noise</option>
      <option value="UC5 Excessive Temperature">UC5 Excessive Temperature</option>
      <option value="UC6 Fire and Explosion Hazards">UC6 Fire and Explosion Hazards</option>
      <option value="UC7 Improper Personnel Attire/PPE">UC7 Improper Personnel Attire/PPE</option>
      <option value="UC8 Improper Placement/Storage">UC8 Improper Placement/Storage</option>
      <option value="UC9 Inadequate Guards/Devices">UC9 Inadequate Guards/Devices</option>
      <option value="UC10 Inadequate Lighting">UC10 Inadequate Lighting</option>
      <option value="UC11 Inadequate Maintenance/Inspection">UC11 Inadequate Maintenance/Inspection</option>
      <option value="UC12 Inadequate Ventilation">UC12 Inadequate Ventilation</option>
      <option value="UC13 Inadequate Warning Sign">UC13 Inadequate Warning Sign</option>
      <option value="UC14 Inadequate/No Procedure">UC14 Inadequate/No Procedure</option>
      <option value="UC15 Lack of Emergency Preparedness">UC15 Lack of Emergency Preparedness</option>
      <option value="UC16 Oil / Chemical Spillage">UC16 Oil / Chemical Spillage</option>
      <option value="UC17 Poor Housekeeping">UC17 Poor Housekeeping</option>
      <option value="UC18 Protrusion Hazard">UC18 Protrusion Hazard</option>
      <option value="UC19 Slippery Working Area">UC19 Slippery Working Area</option>
      <option value="UC20 Others">UC20 Others</option>
    </optgroup>
    <optgroup label="--- Good Practice ---">
      <option value="Good Practice">Good Practice</option>
    </optgroup>
  </select>

  <label for="pic">PIC:</label>
  <input type="text" id="pic" placeholder="e.g. Wang Ze Hong @王泽宏 CRBC">

  <label for="company">Company:</label>
  <input type="text" id="company" placeholder="e.g. CRBC">

  <label for="datetime">Date & Time:</label>
  <input type="text" id="datetime">

  <label for="issuedby">Issued by:</label>
  <select id="issuedby">
    <option value="Patrick">Patrick</option>
    <option value="Lim Kim Siang">Lim Kim Siang</option>
    <option value="Brendan Lim">Brendan Lim</option>
    <option value="Andreas">Andreas</option>
    <option value="Femielia">Femielia</option>
    <option value="Hafiz">Hafiz</option>
    <option value="Sui Chin">Sui Chin</option>
    <option value="Zhang Chen Hao">Zhang Chen Hao</option>
  </select>

  <label for="observation">🔍 Observation:</label>
  <textarea id="observation" rows="3" placeholder="Describe the observation..."></textarea>

  <label for="recommendation">✅ Recommendation / Action Taken:</label>
  <textarea id="recommendation" rows="3" placeholder="Describe the action taken or required..."></textarea>

  <button onclick="copyToClipboard()">📋 Copy Text for WhatsApp</button>
</div>

<script>
// Auto-fill Date & Time on load
window.onload = function() {
  const now = new Date();
  const options = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
  const formattedDate = now.toLocaleDateString('en-GB', options).replace(',', ' at');
  document.getElementById('datetime').value = formattedDate;
};

function copyToClipboard() {
  const section = document.getElementById('section').value;
  const location = document.getElementById('location').value;
  const type = document.getElementById('type').value;
  const subhazard = document.getElementById('subhazard').value;
  const pic = document.getElementById('pic').value;
  const company = document.getElementById('company').value;
  const datetime = document.getElementById('datetime').value;
  const issuedby = document.getElementById('issuedby').value;
  const observation = document.getElementById('observation').value;
  const recommendation = document.getElementById('recommendation').value;

  // Construct formatted text matching your exact layout
  const formattedText = 
`🦺 *UNSAFE ACT UNSAFE CONDITION / GOOD PRACTICE FORM*
━━━━━━━━━━━━━━━━━━
*Section:* ${section}
*Location:* ${location}
*Type:* ${type}
*Sub-Hazard:* ${subhazard}
*PIC:* ${pic}
*Company:* ${company}
*Date & Time:* ${datetime}
*Issued by:* ${issuedby}

🔍 *Observation:*
${observation}

✅ *Recommendation / Action Taken:*
${recommendation}`;

  navigator.clipboard.writeText(formattedText).then(() => {
    alert("Copied to clipboard! Switch to WhatsApp and paste.");
  }).catch(err => {
    alert("Failed to copy automatically. Please copy manually.");
  });
}
</script>

</body>
</html>
